<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>Margin</title>
  <!-- Paints the system theme before any script runs, so a dark system never sees a white first frame. -->
  <style>
    html { background: #ffffff; }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) { background: #000000; color-scheme: dark; }
    }
    html[data-theme="dark"] { background: #000000; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="../popup/main.tsx"></script>
</body>
</html>
