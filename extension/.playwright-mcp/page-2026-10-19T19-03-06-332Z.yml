      - generic [ref=f1e26]:
        - heading "Margin support." [level=1] [ref=f1e27]
        - paragraph [ref=f1e28]: Install, update and get help with the Margin extension for Chrome.
      - link "Download this guide as a PDF" [ref=f1e29] [cursor=pointer]:
        - /url: /downloads/margin-support-guide.pdf
      - link "Read the Margin privacy policy" [ref=f1e36] [cursor=pointer]:
        - /url: /margin/privacy/
    - generic [ref=f1e42]:
      - generic [ref=f1e43]:
        - heading "Install Margin." [level=2] [ref=f1e44]
        - list [ref=f1e45]:
          - listitem [ref=f1e46]: Open Margin on the Chrome Web Store in Google Chrome.
          - listitem [ref=f1e47]: Click Add to Chrome, then Add extension.
          - listitem [ref=f1e48]: Click the puzzle piece next to the address bar and pin Margin so its button is always in view.
          - listitem [ref=f1e49]: The welcome tour opens. It walks through a full review in six steps.
        - button "Open the Chrome Web Store (opens in a new tab)" [ref=f1e50] [cursor=pointer]:
          - text: Open the Chrome Web Store
          - generic [ref=f1e51]: (opens in a new tab)
      - generic [ref=f1e52]:
        - heading "Install from a zip." [level=2] [ref=f1e53]
        - paragraph [ref=f1e54]: Use the zip if you cannot install from the Chrome Web Store, for example on a work computer that blocks it. It works in Chrome and Edge.
        - list [ref=f1e55]:
          - listitem [ref=f1e56]: Download the Margin zip and unzip it into a folder you will keep, such as Documents. Chrome loads Margin from that folder every time it starts.
          - listitem [ref=f1e57]: Open chrome://extensions in Chrome, or edge://extensions in Edge.
          - listitem [ref=f1e58]: Turn on Developer mode.
          - listitem [ref=f1e59]: Click Load unpacked and choose the Margin folder, the one with manifest.json inside.
          - listitem [ref=f1e60]: Pin Margin from the puzzle piece in the toolbar. The welcome tour opens.
        - paragraph [ref=f1e61]: A zip install does not update itself, and it keeps its reviews apart from a Chrome Web Store install. To move from one to the other, download your reviews as Word or HTML files first.
        - button "Download Margin 0.3.0" [ref=f1e62] [cursor=pointer]
      - generic [ref=f1e63]:
        - heading "Start a review." [level=2] [ref=f1e64]
        - list [ref=f1e65]:
          - listitem [ref=f1e66]: Open the page you want to review and click the Margin button, or press Alt+Shift+A.
          - listitem [ref=f1e67]: Drag over anything that looks wrong. Write what is wrong, pick a severity and save the note.
          - listitem [ref=f1e68]: Press Esc when you are done, then open the report from the Margin button or the right-click menu.
          - listitem [ref=f1e69]: In the report, click a screenshot to add numbered markers, boxes and arrows.
        - paragraph [ref=f1e70]: You can see every shortcut in Help and settings. Right-click the Margin button and choose Options to open it.
      - generic [ref=f1e71]:
        - heading "Update Margin." [level=2] [ref=f1e72]
        - paragraph [ref=f1e73]: Chrome updates a Chrome Web Store install for you. A new version usually reaches everyone within a few hours of release, and your reviews and settings stay as they are.
        - paragraph [ref=f1e74]: To update straight away, open chrome://extensions in the address bar, turn on Developer mode in the top right corner, and click Update.
        - paragraph [ref=f1e75]: To update a zip install, download the new zip and replace everything inside your Margin folder with the new files. Then click the reload arrow on the Margin card in chrome://extensions. Your reviews stay. Never click Remove to update, because removing Margin deletes its reviews.
      - generic [ref=f1e76]:
        - heading "Fix common problems." [level=2] [ref=f1e77]
        - paragraph [ref=f1e78]: If Margin does not start on a page, reload the page and try again. Chrome does not let extensions run on its own pages, such as chrome:// pages and the Chrome Web Store.
        - paragraph [ref=f1e79]: If the shortcut does nothing, another app may be using it. Open chrome://extensions/shortcuts and pick a new one for Margin.
        - paragraph [ref=f1e80]: If Chrome says the manifest file is missing, you chose the outer folder. Choose the Margin folder that has manifest.json directly inside.
        - paragraph [ref=f1e81]: If the welcome tips no longer show, open Help and settings and click Show the tips again.
      - generic [ref=f1e82]:
        - heading "Remove Margin." [level=2] [ref=f1e83]
        - paragraph [ref=f1e84]: Download any reviews you want to keep as Word or HTML files first. Then right-click the Margin button and choose Remove from Chrome. Removing Margin deletes its saved reviews from your computer.
