        - generic [ref=e87]:
          - heading "Install Margin." [level=2] [ref=e88]
          - list [ref=e89]:
            - listitem [ref=e90]: Open Margin on the Chrome Web Store in Google Chrome.
            - listitem [ref=e91]: Click Add to Chrome, then Add extension.
            - listitem [ref=e92]: Click the puzzle piece next to the address bar and pin Margin so its button is always in view.
            - listitem [ref=e93]: The welcome tour opens. It walks through a full review in six steps.
          - button "Open the Chrome Web Store (opens in a new tab)" [ref=e94] [cursor=pointer]:
            - text: Open the Chrome Web Store
            - generic [ref=e95]: (opens in a new tab)
        - generic [ref=e96]:
          - heading "Start a review." [level=2] [ref=e97]
          - list [ref=e98]:
            - listitem [ref=e99]: Open the page you want to review and click the Margin button, or press Alt+Shift+A.
            - listitem [ref=e100]: Drag over anything that looks wrong. Write what is wrong, pick a severity and save the note.
            - listitem [ref=e101]: Press Esc when you are done, then open the report from the Margin button or the right-click menu.
            - listitem [ref=e102]: In the report, click a screenshot to add numbered markers, boxes and arrows.
          - paragraph [ref=e103]: You can see every shortcut in Help and settings. Right-click the Margin button and choose Options to open it.
        - generic [ref=e104]:
          - heading "Update Margin." [level=2] [ref=e105]
          - paragraph [ref=e106]: Chrome updates Margin for you. A new version usually reaches everyone within a few hours of release, and your reviews and settings stay as they are.
          - paragraph [ref=e107]: To update straight away, open chrome://extensions in the address bar, turn on Developer mode in the top right corner, and click Update.
        - generic [ref=e108]:
          - heading "Fix common problems." [level=2] [ref=e109]
          - paragraph [ref=e110]: If Margin does not start on a page, reload the page and try again. Chrome does not let extensions run on its own pages, such as chrome:// pages and the Chrome Web Store.
          - paragraph [ref=e111]: If the shortcut does nothing, another app may be using it. Open chrome://extensions/shortcuts and pick a new one for Margin.
          - paragraph [ref=e112]: If the welcome tips no longer show, open Help and settings and click Show the tips again.
        - generic [ref=e113]:
          - heading "Remove Margin." [level=2] [ref=e114]
          - paragraph [ref=e115]: Download any reviews you want to keep as Word or HTML files first. Then right-click the Margin button and choose Remove from Chrome. Removing Margin deletes its saved reviews from your computer.
