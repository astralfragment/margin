      - generic [ref=f3e95]:
        - generic [ref=f3e96]:
          - heading "Install Margin." [level=2] [ref=f3e97]
          - list [ref=f3e98]:
            - listitem [ref=f3e99]: Open Margin on the Chrome Web Store in Google Chrome.
            - listitem [ref=f3e100]: Click Add to Chrome, then Add extension.
            - listitem [ref=f3e101]: Click the puzzle piece next to the address bar and pin Margin so its button is always in view.
            - listitem [ref=f3e102]: The welcome tour opens. It walks through a full review in six steps.
          - button "Open the Chrome Web Store (opens in a new tab)" [ref=f3e103] [cursor=pointer]:
            - text: Open the Chrome Web Store
            - generic [ref=f3e104]: (opens in a new tab)
        - generic [ref=f3e105]:
          - heading "Install from a zip." [level=2] [ref=f3e106]
          - paragraph [ref=f3e107]: Use the zip if you cannot install from the Chrome Web Store, for example on a work computer that blocks it. It works in Chrome and Edge.
          - list [ref=f3e108]:
            - listitem [ref=f3e109]: Download the Margin zip and unzip it into a folder you will keep, such as Documents. Chrome loads Margin from that folder every time it starts.
            - listitem [ref=f3e110]: Open chrome://extensions in Chrome, or edge://extensions in Edge.
            - listitem [ref=f3e111]: Turn on Developer mode.
            - listitem [ref=f3e112]: Click Load unpacked and choose the Margin folder, the one with manifest.json inside.
            - listitem [ref=f3e113]: Pin Margin from the puzzle piece in the toolbar. The welcome tour opens.
          - paragraph [ref=f3e114]: A zip install does not update itself, and it keeps its reviews apart from a Chrome Web Store install. To move from one to the other, download your reviews as Word or HTML files first.
          - button "Download Margin 0.3.0" [ref=f3e115] [cursor=pointer]
        - generic [ref=f3e116]:
          - heading "Start a review." [level=2] [ref=f3e117]
          - list [ref=f3e118]:
            - listitem [ref=f3e119]: Open the page you want to review and click the Margin button, or press Alt+Shift+A.
            - listitem [ref=f3e120]: Drag over anything that looks wrong. Write what is wrong, pick a severity and save the note.
            - listitem [ref=f3e121]: Press Esc when you are done, then open the report from the Margin button or the right-click menu.
            - listitem [ref=f3e122]: In the report, click a screenshot to add numbered markers, boxes and arrows.
          - paragraph [ref=f3e123]: You can see every shortcut in Help and settings. Right-click the Margin button and choose Options to open it.
        - generic [ref=f3e124]:
          - heading "Update Margin." [level=2] [ref=f3e125]
          - paragraph [ref=f3e126]: Chrome updates a Chrome Web Store install for you. A new version usually reaches everyone within a few hours of release, and your reviews and settings stay as they are.
          - paragraph [ref=f3e127]: To update straight away, open chrome://extensions in the address bar, turn on Developer mode in the top right corner, and click Update.
          - paragraph [ref=f3e128]: To update a zip install, download the new zip and replace everything inside your Margin folder with the new files. Then click the reload arrow on the Margin card in chrome://extensions. Your reviews stay. Never click Remove to update, because removing Margin deletes its reviews.
        - generic [ref=f3e129]:
          - heading "Fix common problems." [level=2] [ref=f3e130]
          - paragraph [ref=f3e131]: If Margin does not start on a page, reload the page and try again. Chrome does not let extensions run on its own pages, such as chrome:// pages and the Chrome Web Store.
          - paragraph [ref=f3e132]: If the shortcut does nothing, another app may be using it. Open chrome://extensions/shortcuts and pick a new one for Margin.
          - paragraph [ref=f3e133]: If Chrome says the manifest file is missing, you chose the outer folder. Choose the Margin folder that has manifest.json directly inside.
          - paragraph [ref=f3e134]: If the welcome tips no longer show, open Help and settings and click Show the tips again.
        - generic [ref=f3e135]:
          - heading "Remove Margin." [level=2] [ref=f3e136]
          - paragraph [ref=f3e137]: Download any reviews you want to keep as Word or HTML files first. Then right-click the Margin button and choose Remove from Chrome. Removing Margin deletes its saved reviews from your computer.
