      - generic [ref=e89]:
        - generic [ref=e90]:
          - heading "In short." [level=2] [ref=e91]
          - paragraph [ref=e92]: Margin is a Chrome extension published by Lilac Fragment. Everything it saves stays on your computer. It has no server, no account, no analytics and no tracking, and it sends nothing anywhere. Lilac Fragment never sees your reviews.
        - generic [ref=e93]:
          - heading "When Margin runs." [level=2] [ref=e94]
          - paragraph [ref=e95]: Margin only runs on a tab where you start it, from its toolbar button, its keyboard shortcut or the right-click menu. It has no permission to read other sites, and it does not read pages in the background.
        - generic [ref=e96]:
          - heading "What Margin saves." [level=2] [ref=e97]
          - paragraph [ref=e98]: Margin saves what you create in the browser's local storage for the extension, on your computer. That includes the following.
          - list [ref=e99]:
            - listitem [ref=e100]: Screenshots of the visible part of the page where you mark something.
            - listitem [ref=e101]: Your notes, severities and numbered markers.
            - listitem [ref=e102]: The address and title of the page each comment is from.
            - listitem [ref=e103]: The CSS selector of an element you pick, only when selector capture is on.
            - listitem [ref=e104]: Your Margin settings.
        - generic [ref=e105]:
          - heading "What Margin sends." [level=2] [ref=e106]
          - paragraph [ref=e107]: Nothing. Margin makes no network requests. It has no server, no account, no analytics and no tracking. Your data is never sold or shared, and Lilac Fragment cannot see it.
        - generic [ref=e108]:
          - heading "Copying and exporting." [level=2] [ref=e109]
          - paragraph [ref=e110]: Margin only writes to your clipboard when you click Copy for Docs. Word, HTML and print exports are files you save yourself, and you decide where they go and who gets them.
        - generic [ref=e111]:
          - heading "Deleting your data." [level=2] [ref=e112]
          - paragraph [ref=e113]: Delete a comment or a whole review in the report and Margin removes it from its storage. Removing Margin from Chrome clears everything it saved. Download any reviews you want to keep as Word or HTML files first.
        - generic [ref=e114]:
          - heading "Permissions." [level=2] [ref=e115]
          - paragraph [ref=e116]: Margin asks Chrome for six permissions, each for one job.
          - list [ref=e117]:
            - listitem [ref=e118]: activeTab lets Margin take a screenshot of the tab you start it on, and only that tab.
            - listitem [ref=e119]: scripting adds the marking layer to that tab when you start Margin.
            - listitem [ref=e120]: storage keeps your reviews and settings on your computer.
            - listitem [ref=e121]: unlimitedStorage is needed because screenshots soon outgrow the browser's default storage limit.
            - listitem [ref=e122]: clipboardWrite lets Copy for Docs put the finished review on your clipboard.
            - listitem [ref=e123]: contextMenus adds Margin to the right-click menu.
        - generic [ref=e124]:
          - heading "Future changes." [level=2] [ref=e125]
          - paragraph [ref=e126]: We may later add features that send data off your computer, such as team sharing or sync. If we do, we will update this policy and the Chrome Web Store listing before that version ships, and those features will say what they send.
        - paragraph [ref=e127]:
          - text: This policy covers the Margin extension. The lilacfragment.co.za website has its own
          - link "privacy notice" [ref=e128] [cursor=pointer]:
            - /url: /privacy/
          - text: .
